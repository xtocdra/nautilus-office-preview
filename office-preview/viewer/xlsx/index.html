
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Spreadsheet Preview</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: sans-serif;
            color: #242424;
            background: #f6f6f6;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 48px;
            padding: 8px 14px;
            background: #ffffff;
            border-bottom: 1px solid #d8d8d8;
        }

        #sheet-select {
            max-width: 240px;
            min-width: 120px;
            padding: 6px 10px;
            border: 1px solid #c8c8c8;
            border-radius: 6px;
            background: #ffffff;
            font-size: 13px;
        }

        #sheet-info {
            margin-left: auto;
            color: #777;
            font-size: 12px;
        }

        #file-input {
            display: none;
        }

        #open-file {
            padding: 6px 12px;
            border: 1px solid #c8c8c8;
            border-radius: 6px;
            background: #ffffff;
            cursor: pointer;
            font-size: 12px;
        }

        #spreadsheet {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 12px;
        }

        #spreadsheet table {
            border-collapse: collapse;
            background: #ffffff;
            font-size: 13px;
            white-space: nowrap;
        }

        #spreadsheet td,
        #spreadsheet th {
            min-width: 80px;
            height: 26px;
            padding: 4px 8px;
            border: 1px solid #dedede;
            text-align: left;
        }

        #spreadsheet th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #eeeeee;
            font-weight: 600;
        }

        #status {
            padding: 24px;
            color: #666;
            text-align: center;
        }

        #status.error {
            color: #b00020;
        }
    </style>

    <script src="xlsx.js" defer></script>
    <script src="xlsx-preview.js" defer></script>
</head>

<body>
    <header id="toolbar">
        <select id="sheet-select" disabled>
            <option>No workbook loaded</option>
        </select>

        <span id="sheet-info"></span>

        <input
            id="file-input"
            type="file"
            accept=".xlsx,.xls,.xlsm,.xlsb"
        >

        <button id="open-file">Open workbook</button>
    </header>

    <main id="spreadsheet">
        <div id="status">Select an Excel workbook to preview.</div>
    </main>
</body>
</html>
